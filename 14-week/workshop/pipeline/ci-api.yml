# Proposal for .github/workflows/ci.yml of a Java service (written for opti-customers-api; for
# products/sales/auth change DOMAIN, for worker/workflow drop the `integration` job).
# Every job is a required status check on develop/qa/main (03-branch-protection.md).
#
#   build-and-test  compile + unit + HTTP/contract checks + coverage floor (declared <= measured)
#   integration     JdbcRepositoriesIntegrationTest against a real PostgreSQL migrated with opti-<domain>-db
#   quality         format of the changed Java files, hexagonal boundary, no TODO/FIXME
#   security        gitleaks + OWASP dependency-check (CVSS >= 7 fails)
name: CI

on:
  pull_request:
    branches: [develop, qa, main]
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOMAIN: customers
  COVERAGE_FLOOR: '0'         # line coverage of *-core, %. PLACEHOLDER: set it to the value the first green run
                              # prints, rounded down; after that it only goes up (declared <= measured).

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: maven }
      - name: Build, unit and HTTP tests with coverage
        run: >
          mvn -B org.jacoco:jacoco-maven-plugin:0.8.12:prepare-agent verify
          org.jacoco:jacoco-maven-plugin:0.8.12:report
      - name: Coverage floor of the domain module
        run: |
          csv=$(ls ./*-core/target/site/jacoco/jacoco.csv)
          awk -F, -v floor="$COVERAGE_FLOOR" 'NR>1 {miss+=$8; cov+=$9}
            END {pct = (miss+cov) ? 100*cov/(miss+cov) : 0;
                 printf "line coverage of %s: %.1f%% (floor %s%%)\n", FILENAME, pct, floor;
                 exit (pct + 0.0001 < floor) }' "$csv"
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: test-reports, path: '**/target/surefire-reports/*.xml', retention-days: 7 }

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16.9-alpine
        env:
          POSTGRES_DB: customers
          POSTGRES_USER: customers_owner
          POSTGRES_PASSWORD: ci-only-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U customers_owner -d customers"
          --health-interval 5s --health-timeout 3s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - name: Check out the schema repo at the same base branch
        uses: actions/checkout@v4
        with:
          repository: code-corhuila/opti-${{ env.DOMAIN }}-db
          ref: ${{ github.base_ref || 'develop' }}
          path: schema
      - name: Migrate (same Flyway image and config as opti-infra)
        run: |
          docker run --rm --network host -v "$PWD/schema:/workspace:ro" \
            -e FLYWAY_URL=jdbc:postgresql://localhost:5432/customers \
            -e FLYWAY_USER=customers_owner -e FLYWAY_PASSWORD=ci-only-password \
            -e FLYWAY_PLACEHOLDERS_SEEDDEMODATA=false \
            flyway/flyway:11.20.3 -workingDirectory=/workspace -configFiles=/workspace/flyway.toml migrate
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: maven }
      - name: Persistence tests against the real database (not skipped)
        env:
          TEST_DATABASE_URL: jdbc:postgresql://localhost:5432/customers?user=customers_owner&password=ci-only-password
        run: |
          mvn -B verify -Dtest='*IntegrationTest' -Dsurefire.failIfNoSpecifiedTests=false
          # Prove it ran: a skipped integration test would make this gate a lie.
          reports=$(find . -path '*surefire-reports*' -name 'TEST-*IntegrationTest.xml')
          [ -n "$reports" ] || { echo "::error::no integration test report"; exit 1; }
          # shellcheck disable=SC2086
          if grep -L 'skipped="0"' $reports | grep -q .; then echo "::error::integration tests were skipped"; exit 1; fi

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Changed Java files are google-java-format clean (existing code is not reformatted in one go)
        run: |
          files=$(git diff --name-only --diff-filter=AM "origin/${{ github.base_ref || 'develop' }}...HEAD" -- '*.java')
          [ -z "$files" ] && { echo "no Java changes"; exit 0; }
          curl -sSLo gjf.jar https://github.com/google/google-java-format/releases/download/v1.24.0/google-java-format-1.24.0-all-deps.jar
          # shellcheck disable=SC2086
          java -jar gjf.jar --aosp --dry-run --set-exit-if-changed $files
      - name: Hexagonal boundary - the domain module has no framework or I/O imports
        run: |
          if grep -rnE 'import (org\.springframework|jakarta\.persistence|java\.sql|java\.net\.http)' ./*-core/src/main; then
            echo "::error::*-core must not depend on frameworks or I/O (DoD, hexagonal architecture)"; exit 1
          fi
      - name: No TODO/FIXME without an issue
        run: ./.github/scripts/no-todo.sh

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Secrets in the history (gitleaks CLI; the action needs a paid licence for orgs)
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 detect --source /repo --redact --no-banner
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: maven }
      - name: Known CVEs in dependencies (CVSS >= 7 fails)
        run: >
          mvn -B org.owasp:dependency-check-maven:12.1.0:aggregate
          -DfailBuildOnCVSS=7 -DnvdApiKey=${{ secrets.NVD_API_KEY }}
          -DsuppressionFile=dependency-check-suppressions.xml -DsuppressionFileFailOnMissing=false
