# Security gates proposed for opti-customers-api (ms-pacientes).
# Copy to .github/workflows/security.yml in that repo. Paths are relative to its root.
# Covers STRIDE PR "Threat model: api-gateway → ms-pacientes" in opti-docs.
name: security

on:
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  secrets-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-audit:
    name: Dependency audit (OWASP dependency-check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Fail on CVSS >= 7
        run: >
          mvn -B -q org.owasp:dependency-check-maven:12.1.0:aggregate
          -DfailBuildOnCVSS=7
          -DnvdApiKey=${{ secrets.NVD_API_KEY }}

  authz-negative-tests:
    name: Negative authorization tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Patients ownership / role checks must hold
        run: >
          mvn -B -pl customers-app -am test
          -Dtest=PatientFormulasAuthorizationTest
          -Dsurefire.failIfNoSpecifiedTests=false
