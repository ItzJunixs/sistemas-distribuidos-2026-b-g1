openapi: 3.0.3
info:
  title: eduTrack API Gateway
  version: 1.0.0
  description: |
    Unified entry point for the eduTrack platform.
    Handles routing, TLS termination, global rate limiting, and JWT authentication forwarding.

servers:
  - url: http://localhost:8080/api/v1
    description: Local API Gateway

paths:
  /health:
    get:
      summary: Gateway health check
      tags: [System]
      responses:
        '200':
          description: Gateway is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: UP

  /auth/login:
    post:
      summary: Authenticate user (routed to identity-service)
      tags: [Routing - Identity]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        '200':
          description: Authentication successful
        '401':
          $ref: './_shared.yaml#/components/responses/Unauthorized'

  /academic/grades/student/{studentId}:
    get:
      summary: Query student grades (routed to academic-service)
      description: |
        Authorization Boundary: INV-PAR-001/002. Caller must be the student themselves,
        or a parent linked to the student.
      tags: [Routing - Academic]
      security:
        - bearerAuth: []
      parameters:
        - name: studentId
          in: path
          required: true
          schema:
            $ref: './_shared.yaml#/components/schemas/UUID'
      responses:
        '200':
          description: List of student grades
        '403':
          description: Forbidden - Caller is not authorized to view grades for this studentId

  /attendance/student/{studentId}:
    get:
      summary: Query student attendance records (routed to attendance-service)
      tags: [Routing - Attendance]
      security:
        - bearerAuth: []
      parameters:
        - name: studentId
          in: path
          required: true
          schema:
            $ref: './_shared.yaml#/components/schemas/UUID'
      responses:
        '200':
          description: List of student attendance records

  /notifications:
    get:
      summary: Query parent notifications (routed to notifications-service)
      tags: [Routing - Notifications]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Paginated notifications for logged-in parent

  /communication/conversations:
    get:
      summary: List user conversations (routed to communication-service)
      tags: [Routing - Communication]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Conversation threads

components:
  securitySchemes:
    bearerAuth:
      $ref: './_shared.yaml#/components/securitySchemes/bearerAuth'
