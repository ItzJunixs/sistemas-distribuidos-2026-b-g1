version: '3.8'

services:
  # Pattern: <abbr>-<domain>-<piece> -> educk-comm-db
  postgres-db:
    image: postgres:16-alpine
    container_name: educk-comm-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be defined in .env}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be defined in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be defined in .env}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      edutrack-net:
        aliases:
          - educk-comm-db
          - postgres-db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Pattern: <abbr>-<domain>-<piece> -> educk-comm-api
  communication-service:
    build:
      context: ./edutrack
      dockerfile: Dockerfile
    image: educk-comm-api:latest
    container_name: educk-comm-api
    restart: unless-stopped
    depends_on:
      postgres-db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: postgres-db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:?POSTGRES_DB must be defined in .env}
      DB_USER: ${POSTGRES_USER:?POSTGRES_USER must be defined in .env}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be defined in .env}
      SERVER_PORT: 8085
    ports:
      - "8085:8085"
    networks:
      edutrack-net:
        aliases:
          - educk-comm-api
          - communication-service

  # Pattern: <abbr>-<domain>-<piece> -> educk-comm-portal
  frontend-service:
    build:
      context: ./edutrack-frontend
      dockerfile: Dockerfile
    image: educk-comm-portal:latest
    container_name: educk-comm-portal
    restart: unless-stopped
    ports:
      - "3000:80"
    networks:
      edutrack-net:
        aliases:
          - educk-comm-portal
          - frontend-service

networks:
  edutrack-net:
    driver: bridge

volumes:
  pgdata:
